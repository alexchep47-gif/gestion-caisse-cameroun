<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion de caisse hors ligne pour petits commerces camerounais">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ma Caisse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <title>Ma Caisse — Gestion Caisse Cameroun</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0f766e;
      overflow: hidden;
    }
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f766e 0%, #115e59 50%, #0f4c47 100%);
      color: #ecfdf5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    .splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      background: #0f766e;
    }
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    .subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      margin: 0 0 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #5eead4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <img class="logo" src="favicon.svg" alt="Ma Caisse" width="72" height="72">
    <p class="title">Ma Caisse</p>
    <p class="subtitle">Chargement…</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
    setTimeout(function () {
      var el = document.getElementById('splash');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 400);
      }
    }, 12000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
