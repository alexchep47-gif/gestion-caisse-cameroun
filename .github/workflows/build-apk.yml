name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accepter les licences Android
        run: |
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          yes | sdkmanager --licenses >/dev/null 2>&1
          true

      - name: Installer NDK 27 (si manquant)
        run: |
          set +e
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager)"; fi
          "$SM" --install "ndk;27.0.12077973" || true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Construire l’APK release
        run: flutter build apk --release

      - name: Renommer l’APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ma-caisse-${{ github.sha }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/ma-caisse-latest.apk
          ls -lh dist/

      - name: Publier l’artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-caisse-apk
          path: dist/*.apk
          retention-days: 30
