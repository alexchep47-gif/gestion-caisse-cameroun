name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/flutter.yml'
      - '**.md'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ne plus annuler un build en cours : les runs s'enchaînent au lieu d'être tués
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Installer les dépendances
        run: flutter pub get
      - name: Construire Flutter Web
        run: flutter build web --release --base-href "/gestion-caisse-cameroun/"
      - name: Préparer l’hébergement SPA
        run: cp build/web/index.html build/web/404.html
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
